<body><div id="toast" class="toast"></div><main class="login-shell"><section class="login-card"><div class="brand" style="margin-bottom:18px"><div class="brand-logo">O</div><div><h1>أوسكار</h1><p>تسجيل دخول موحد حسب مفتاح الشركة</p></div></div><form id="loginForm"><div class="field"><label>مفتاح الشركة</label><input class="input" id="companyKey" value="COMPANY001" autocomplete="organization"></div><div class="field"><label>اسم المستخدم</label><input class="input" id="username" value="admin" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input class="input" id="password" type="password" value="123456" autocomplete="current-password"></div><button class="primary-btn" id="loginBtn" type="submit">تسجيل الدخول</button></form><p style="font-size:12px;color:var(--muted);line-height:1.8;margin-top:14px">الحساب الافتراضي: COMPANY001 / admin / 123456. بعد الدخول غيّر كلمة المرور من قسم الموظفين أو لوحة الأدمن المنفصلة لاحقاً.</p></section></main><script type="module">
const firebaseConfig = {apiKey:"AIzaSyCnLAY7zQyBy7gUuL9wszt9aEhiJgvRmxI",authDomain:"shop-d52dc.firebaseapp.com",databaseURL:"https://shop-d52dc-default-rtdb.firebaseio.com",projectId:"shop-d52dc",storageBucket:"shop-d52dc.appspot.com",messagingSenderId:"97580537866",appId:"1:97580537866:web:abc46e5a2f527b6300a7f3",measurementId:"G-956RQMBP42"};
const $=s=>document.querySelector(s); const toast=(m,t='ok')=>{const el=$('#toast'); el.textContent=m; el.style.background=t==='bad'?'#b91c1c':t==='warn'?'#92400e':'#111827'; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2400)};
const permissionCatalog=['viewSales','addSales','editSales','deleteSales','viewProducts','addProducts','editProducts','deleteProducts','viewCustomers','manageAccounts','manageSuppliers','viewReports','manageExpenses','manageSettings','manageEmployees','print','export','sync'];
const fullPermissions=Object.fromEntries(permissionCatalog.map(k=>[k,true]));
async function sha256(text){const data=new TextEncoder().encode(text); const h=await crypto.subtle.digest('SHA-256',data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function defaultCompany(companyKey){const salt=companyKey+'_admin_salt'; return {companyKey,active:true,subscriptionEnd:'2099-12-31',admin:{username:'admin',passwordSalt:salt,passwordHash:await sha256('123456'+salt),lastLogin:null}}}
async function getLocalCompany(companyKey){let c; try{c=JSON.parse(localStorage.getItem('oscarCompany_'+companyKey))}catch(e){} if(!c){c=await defaultCompany(companyKey); localStorage.setItem('oscarCompany_'+companyKey,JSON.stringify(c));} return c;}
async function tryCloud(companyKey){try{const appMod=await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js'); const fs=await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js'); const au=await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js'); const app=appMod.initializeApp(firebaseConfig); const auth=au.getAuth(app); await au.signInAnonymously(auth); const db=fs.getFirestore(app); const compRef=fs.doc(db,'companies',companyKey); const compSnap=await fs.getDoc(compRef); if(!compSnap.exists()){const c=await defaultCompany(companyKey); await fs.setDoc(compRef,{active:true,subscriptionEnd:c.subscriptionEnd,storeName:'أوسكار'},{merge:true}); await fs.setDoc(fs.doc(db,'companies',companyKey,'admin','main'),c.admin,{merge:true}); return c;} const company=compSnap.data(); const adminSnap=await fs.getDoc(fs.doc(db,'companies',companyKey,'admin','main')); const empSnap=await fs.getDocs(fs.collection(db,'companies',companyKey,'employees')); return {companyKey,active:company.active!==false,subscriptionEnd:company.subscriptionEnd||'2099-12-31',admin:adminSnap.exists()?adminSnap.data():null,employees:empSnap.docs.map(d=>({id:d.id,...d.data()})),_cloud:{fs,db}};}catch(e){console.warn('cloud auth unavailable',e); return null;}}
async function login(e){e.preventDefault(); const companyKey=$('#companyKey').value.trim(); const username=$('#username').value.trim(); const pass=$('#password').value; if(!companyKey||!username||!pass) return toast('أدخل كل بيانات الدخول','bad'); $('#loginBtn').disabled=true; $('#loginBtn').textContent='جاري التحقق...'; const local=await getLocalCompany(companyKey); const cloud=await tryCloud(companyKey); const company=cloud||local; if(company.active===false){toast('الشركة غير مفعلة','bad'); return reset();} if(new Date(company.subscriptionEnd)<new Date()){toast('انتهى اشتراك الشركة','bad'); return reset();} let session=null; if(username==='admin'){const admin=company.admin||local.admin; if(!admin){toast('لا يوجد حساب مدير','bad'); return reset();} const hash=await sha256(pass+admin.passwordSalt); if(hash!==admin.passwordHash){toast('كلمة مرور المدير غير صحيحة','bad'); return reset();} session={companyKey,userId:'admin',name:'المدير',role:'admin',permissions:fullPermissions,loginAt:Date.now()}; local.admin.lastLogin=Date.now(); localStorage.setItem('oscarCompany_'+companyKey,JSON.stringify(local));} else {let emps=company.employees||[]; if(!emps.length){try{emps=JSON.parse(localStorage.getItem('oscarEmployees_'+companyKey))||JSON.parse(localStorage.getItem('oscarStoreV2_'+companyKey))?.employees||[]}catch(e){emps=[]}} const emp=emps.find(x=>x.username===username || x.id===username); if(!emp){toast('الموظف غير موجود داخل هذه الشركة','bad'); return reset();} if(emp.active===false){toast('حساب الموظف موقوف','bad'); return reset();} const hash=await sha256(pass+emp.passwordSalt); if(hash!==emp.passwordHash){toast('كلمة مرور الموظف غير صحيحة','bad'); return reset();} emp.lastLogin=Date.now(); localStorage.setItem('oscarEmployees_'+companyKey,JSON.stringify(emps)); session={companyKey,userId:emp.id,name:emp.name,role:'employee',permissions:emp.permissions||{},loginAt:Date.now()}; } localStorage.setItem('oscarSession',JSON.stringify(session)); location.href='index.html';}
function reset(){$('#loginBtn').disabled=false; $('#loginBtn').textContent='تسجيل الدخول'}
$('#loginForm').addEventListener('submit',login); if(localStorage.getItem('oscarSession')) location.href='index.html'; if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(console.warn);
</script></body></html>
